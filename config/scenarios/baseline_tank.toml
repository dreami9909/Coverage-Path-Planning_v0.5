# 기준 시나리오 — Tank 케이스, v0.4 인증 조건 그대로 (바이블).
# 파일 하나가 실험 하나다. 실행: make scenario S=config/scenarios/baseline_tank.toml
#
# Tank 인증 격자는 8×8 이다 (TEL 은 10×10). AOI 반경 8,884 m(케이스 확정값,
# 1,080 s 순변위 99%)을 외접 정사각으로 8등분 → 셀 2,221 m. seed 3종
# (20260201~03) 전부 gap 1% 이내 인증이 열린 상한 격자다
# (config/chapter4_synthetic_terrain.json 의 기준 격자 note).
#
# 주의: grid.n 의 생략 기본값은 케이스와 무관하게 10 이라, Tank 인증 격자
# 8 을 적는 순간 provenance 가 grid.n 을 custom_inputs 로 올린다 — 라벨만
# 그런 것이고, 이 8×8 이 Tank 의 v0.4 인증 조건 그 자체다.
#
# 재현 실적 (v0.5 코드, 2026-11-09): 계획 PD(최악) 0.7474 (STOP_HEAVY) ·
# gap 0.810% · 1회 solve 인증 — v0.4 기록 0.7465 / 0.977% 과 solve
# 비결정성 범위 내 일치. MC(규약맞춤 연속) 최악 0.6849, model−MC +0.0625.

name = "baseline_tank"
seed = 20260201   # v0.4 인증 seed (20260201~03 중 첫째)

[seeker]
template = "SR-Z50"          # 프리셋이 기본값을 채우고, 아래 키가 우선한다
altitude_m = 600.0
detection_probability = 0.86
false_alarm_probability = 0.05

[seeker.eo]
resolution = [1280, 720]
hfov_deg = 18.0

[seeker.ir]
resolution = [1280, 720]
hfov_deg = 18.0

[seeker.gimbal]
max_angle_deg = 45.0         # 김발 제어각
slew_rate_dps = 60.0         # 김발 전환 속도
scan_rate_dps = 30.0         # 탐색 스캔 속도

[vehicle]
count = 6
search_speed_kph = 160.0
transit_speed_kph = 160.0

[mission]
ingress_s = 480.0            # 이송 (표적 확산이 belief 에 반영됨)
search_s = 600.0             # 탐색

[target]
case = "Tank"                # 케이스가 AOI(8,884 m)·최악 거동 집합·시그니처를 정함
max_speed_kph = 40.0
tp_error_sigma_m = 500.0     # 위치(제보) 오차 = 초기 belief 폭 (선언 가정)

[terrain]
weighting = true             # 지형 가중 (사전·전이) on/off
bias_strength = 0.6          # 이동 편향 (지형 가중치)
offroad_probability = 0.2
halt_probability_boost = 0.35
concealment_count = 3        # 은닉 지대 수 (은닉 가중치)

[grid]
kind = "square"              # N×N 외접 정사각 (기본) | operational-polar
n = 8                        # Tank 인증 격자 8×8 (셀 2,221 m) — 위 주의 참조

[solver]
kind = "milp"
certificate_gap = 0.01       # 사전선언 인증 기준 1%

[evaluation]
mc_samples = 1000
particles = 5000
